plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.prj1'
version = '0.0.1-SNAPSHOT'
description = 'MiniApart - He thong Quan ly va Van hanh Chung cu mini'

// Java 21 LTS. Khong chay ban moi hon vi mot ly do cu the: ASM ma ArchUnit 1.4.1
// dong goi chi doc duoc tep lop toi Java 25. Gap tep lop moi hon thi no BO QUA
// trong im lang - luat kien truc van bao xanh du khong soi vao lop nao. Loi do
// khong lo ra o dau ca, nen ArchitectureRulesTest co them mot phep kiem tra rang
// so lop nhap vao phai lon hon khong.
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencyManagement {
	imports {
		// Spring Boot 4 no longer pins Testcontainers, so the BOM is imported explicitly.
		mavenBom 'org.testcontainers:testcontainers-bom:1.21.3'
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT: jjwt tach api/impl/jackson de ma ung dung chi thay phan giao dien.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// Boot 4 keeps Flyway's auto-configuration in its own module; flyway-core alone
	// lands on the classpath but never runs.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Boot 4 split MockMvc test support out of spring-boot-test-autoconfigure.
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// Quy uoc 1 va 2 duoc ep bang may, khong dua vao tri nho nguoi viet ma.
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// Testcontainers probes only the well-known socket paths. Colima and Rancher Desktop
	// keep theirs under $HOME, so hand it whichever endpoint the docker CLI is already
	// using. An explicit DOCKER_HOST in the environment always wins, and if docker is
	// missing entirely we stay quiet and let the test report say so.
	doFirst {
		if (!System.getenv('DOCKER_HOST')) {
			String endpoint = activeDockerEndpoint()
			if (endpoint) {
				environment 'DOCKER_HOST', endpoint
				environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
				// The docker-java client falls back to API 1.32, which Docker Engine 25
				// and later refuse outright. Pin it to whatever the engine reports.
				String apiVersion = activeDockerApiVersion()
				if (apiVersion) {
					systemProperty 'api.version', apiVersion
				}
			}
		}
	}
}

/** The API version the running docker engine reports, or null. */
static String activeDockerApiVersion() {
	return runDocker(['docker', 'version', '--format', '{{.Server.APIVersion}}'])
}

/** The unix socket of the docker engine the CLI currently points at, or null. */
static String activeDockerEndpoint() {
	String endpoint = runDocker(['docker', 'context', 'inspect', '--format', '{{.Endpoints.docker.Host}}'])
	return endpoint?.startsWith('unix://') ? endpoint : null
}

/** Runs a docker command, returning its trimmed output, or null if docker is unusable. */
static String runDocker(List<String> command) {
	try {
		Process process = command.execute()
		process.waitForOrKill(5_000)
		String output = process.text.trim()
		return output.isEmpty() ? null : output
	}
	catch (Exception ignored) {
		return null
	}
}
