spring:
  application:
    name: ccm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ccm}
    username: ${DB_USER:ccm}
    password: ${DB_PASSWORD:ccm}
  jpa:
    open-in-view: false
    hibernate:
      # Quy uoc so 2: moi thay doi luoc do di qua Flyway. Hibernate khong duoc dung
      # den cau truc bang, ke ca o moi truong phat trien.
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
