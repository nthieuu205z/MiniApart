spring:
  application:
    name: ccm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ccm}
    username: ${DB_USER:ccm}
    password: ${DB_PASSWORD:ccm}
  jpa:
    open-in-view: false
    hibernate:
      # Quy uoc so 2: moi thay doi luoc do di qua Flyway. Hibernate khong duoc dung
      # den cau truc bang, ke ca o moi truong phat trien.
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # GIA TRI NAY CHI DUNG DE PHAT TRIEN. Vertical Slice 11 phai truyen JWT_SECRET
    # that qua bien moi truong khi len may chu; de nguyen chuoi nay tren Internet
    # nghia la bat ky ai doc duoc repo cung tu ky duoc token quan tri.
    secret: ${JWT_SECRET:chuoi-bi-mat-chi-dung-khi-phat-trien-doi-truoc-khi-trien-khai}
    thoi-han-phut: ${JWT_THOI_HAN_PHUT:30}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
