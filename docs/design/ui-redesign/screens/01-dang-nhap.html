<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · MiniApart</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<style>
  /* Bố cục riêng của màn đăng nhập (chỉ vị trí, mọi giá trị lấy token) */
  .login { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 16px; min-height: 100vh; padding: 16px; }
  .login-form { background: var(--ma-bg-card); border-radius: var(--ma-radius-xl); padding: 40px 56px; display: flex; flex-direction: column; }
  .login-form form { display: grid; gap: 20px; margin-top: 40px; }
  .login-photo { position: relative; border-radius: var(--ma-radius-xl); overflow: hidden; }
  .login-photo img { width: 100%; height: 100%; object-fit: cover; }
  .login-photo .cap { position: absolute; left: 24px; bottom: 24px; right: 24px; display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; }
  .cap-card { background: var(--ma-bg-card); border-radius: 20px; padding: 16px 20px; max-width: 360px; }
  @media (max-width: 900px) { .login { grid-template-columns: 1fr; } .login-photo { display: none; } .login-form { padding: 32px 24px; } }
</style>
</head>
<body>
<!-- Màn khung (1) Đăng nhập — 1440×900. Một hành động chính: Đăng nhập. Ảnh là ảnh phòng thật của dự án (frontend/public/rooms). -->
<div class="login">
  <section class="login-form" aria-labelledby="t">
    <div class="row" style="gap:10px"><div class="logo" aria-hidden="true">M</div><span class="sb-name">MiniApart</span></div>
    <div style="margin-top:auto">
      <h1 class="h1" id="t">Đăng nhập</h1>
      <p class="t-2" style="margin-top:8px">Dùng số điện thoại đã đăng ký với ban quản lý toà nhà.</p>
      <form novalidate>
        <div class="field">
          <label class="label" for="sdt">Số điện thoại</label>
          <div class="input-wrap"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg><input class="input input-touch" id="sdt" inputmode="tel" autocomplete="tel" value="0999 000 011"></div>
        </div>
        <div class="field">
          <div class="spread"><label class="label" for="mk">Mật khẩu</label><a class="t-sm hit" href="#quen">Quên mật khẩu?</a></div>
          <div class="input-wrap"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><input class="input input-touch" id="mk" type="password" autocomplete="current-password" value="••••••••••••" aria-invalid="true" aria-describedby="mk-err">
            <button type="button" class="icon-btn trail" aria-label="Hiện mật khẩu"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></button></div>
          <p class="error-text" id="mk-err"><svg class="ic-sm" aria-hidden="true"><use href="#i-alert"/></svg>Mật khẩu chưa đúng. Còn 4 lần thử trước khi tạm khoá 15 phút.</p>
        </div>
        <label class="check"><input type="checkbox" checked> Ghi nhớ trên thiết bị này</label>
        <button class="btn btn-primary btn-touch btn-block" type="submit">Đăng nhập</button>
      </form>
    </div>
    <p class="t-meta" style="margin-top:auto;padding-top:32px">Chưa có tài khoản? Ban quản lý toà nhà sẽ gửi mã kích hoạt qua số điện thoại của bạn.</p>
  </section>
  <figure class="login-photo">
    <img src="../assets/img/annhien_studio_noi_that.webp" alt="Phòng studio nội thất, An Nhiên Residence">
    <figcaption class="cap">
      <div class="cap-card">
        <p class="h3">Một nơi cho cả chủ nhà, quản lý, thợ và người thuê</p>
        <p class="t-sm t-2" style="margin-top:6px">Hoá đơn, chỉ số điện nước, hợp đồng và sự cố — cùng một sổ, cùng một số liệu.</p>
      </div>
      <span class="tag tag-neutral" style="background:var(--ma-bg-card)"><svg class="ic-sm" aria-hidden="true"><use href="#i-pin"/></svg>An Nhiên Residence · Hà Nội</span>
    </figcaption>
  </figure>
</div>
<script src="../assets/icons.js"></script>
</body>
</html>
