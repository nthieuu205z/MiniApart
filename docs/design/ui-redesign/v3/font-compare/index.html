<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>So sánh font — MiniApart V3</title>
<style id="faces"></style>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #16191d; font: 14px/1.5 system-ui; width: 1600px; }
  h1 { font: 600 20px/1.3 system-ui; margin: 0 0 4px; }
  .note { color: #555; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .spec { border: 1px solid #d9dce0; border-radius: 8px; padding: 16px; }
  .spec > b { display: block; font: 600 12px/1 system-ui; color: #555; margin-bottom: 12px; }
  .t { font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
  .big { font-size: 30px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #eceef0; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .s13 { font-size: 13px; } .s14 { font-size: 14px; } .s16 { font-size: 16px; }
  .sub { color: #555; }
  .caps { font-weight: 600; font-size: 14px; margin-top: 8px; }
  .lbl { font: 11px/1 system-ui; color: #888; margin: 10px 0 2px; }
</style>
<h1>Cùng một nội dung thật của MiniApart, 8 font, cỡ 13 / 14 / 16 px</h1>
<p class="note">Số tiền dùng <code>tabular-nums</code>. Dữ liệu lấy từ stack demo (GET).</p>
<div class="grid" id="g"></div>
<script>
  // [tên CSS, tên file, biến thiên?]
  const FONTS = [
    ['Inter', 'inter', true], ['Be Vietnam Pro', 'be-vietnam-pro', false], ['IBM Plex Sans', 'ibm-plex-sans', false], ['Source Sans 3', 'source-sans-3', true],
    ['Roboto', 'roboto', true], ['Noto Sans', 'noto-sans', true], ['Public Sans', 'public-sans', true], ['Geist', 'geist', true],
  ]
  const R = { 'latin': 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD',
    'latin-ext': 'U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF',
    'vietnamese': 'U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB' }
  let css = ''
  for (const [name, file, variable] of FONTS) for (const sub of Object.keys(R)) {
    if (variable) css += `@font-face{font-family:"${name}";font-weight:100 900;src:url(fonts/${file}-${sub}-wght-normal.woff2) format("woff2");unicode-range:${R[sub]}}\n`
    else for (const w of [400, 500, 600, 700]) css += `@font-face{font-family:"${name}";font-weight:${w};src:url(fonts/${file}-${sub}-${w}-normal.woff2) format("woff2");unicode-range:${R[sub]}}\n`
  }
  document.getElementById('faces').textContent = css
  const rows = [['Nguyễn Quang Huy · Phòng 201', '17.676.000 ₫'], ['Đỗ Thanh Hương · Phòng 302', '1.895.000 ₫'], ['Vũ Khánh Linh · Phòng 303', '111.594.000 ₫']]
  document.getElementById('g').innerHTML = FONTS.map(([name]) => `<div class="spec" style="font-family:'${name}'"><b>${name}</b>
    <div class="t">Nợ quá hạn theo người</div><div class="big">173.450.000 ₫</div>
    ${[13, 14, 16].map((s) => `<div class="lbl">${s}px</div>` + rows.map((r) => `<div class="row s${s}"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')).join('')}
    <div class="lbl">dấu chồng, 14px thường và đậm</div>
    <div class="s14">Hợp đồng sắp hết hạn, đã ký giấy. Bình nóng lạnh ngắt bất thường, cần kiểm tra điện trở. Kỳ 11/2026 chưa chốt: còn 4 công tơ chưa ghi.</div>
    <div class="caps">Đặng Hoài Ấn · Nguyễn Thị Ánh Tuyết · Kỳ tháng Mười Một</div>
    <div class="s13 sub">Hạn 05/10/2026 · trễ 52 ngày · 0999 100 001 · 96 kWh · 5 m³</div></div>`).join('')

  // Đo: chữ số có bằng nhau khi bật tabular-nums không, x-height, bề rộng câu mẫu, có glyph ₫ không, độ cao dấu chồng.
  window.measure = async () => {
    await document.fonts.ready
    await Promise.all(FONTS.flatMap(([n]) => [400, 600].map((w) => document.fonts.load(`${w} 16px "${n}"`, 'Ễ₫0'))))
    const c = document.createElement('canvas').getContext('2d')
    const span = document.createElement('span'); span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:100px'; document.body.appendChild(span)
    const w = (font, text, tnum) => { span.style.fontFamily = `"${font}"`; span.style.fontVariantNumeric = tnum ? 'tabular-nums' : 'normal'; span.textContent = text; return span.getBoundingClientRect().width }
    const out = FONTS.map(([n]) => {
      c.font = `400 100px "${n}"`
      const m = (t) => c.measureText(t)
      const prop = '0123456789'.split('').map((d) => +w(n, d, false).toFixed(1)), tab = '0123456789'.split('').map((d) => +w(n, d, true).toFixed(1))
      c.font = '400 100px monospace'; const fb = c.measureText('₫').width; c.font = `400 100px "${n}", monospace`
      return { font: n, loaded: document.fonts.check(`400 16px "${n}"`, 'Ễ₫'), xHeight: +m('x').actualBoundingBoxAscent.toFixed(1), capHeight: +m('H').actualBoundingBoxAscent.toFixed(1),
        stackedTop: +m('Ễ').actualBoundingBoxAscent.toFixed(1), below: +m('ự').actualBoundingBoxDescent.toFixed(1),
        tabularEqual: new Set(tab).size === 1, proportionalByDefault: new Set(prop).size > 1, digitTab: tab[0],
        sentence14: +(w(n, 'Hợp đồng sắp hết hạn, đã ký giấy. Bình nóng lạnh ngắt bất thường.', false) * 0.14).toFixed(0),
        dongGlyph: Math.abs(c.measureText('₫').width - fb) > 0.5 || document.fonts.check(`400 16px "${n}"`, '₫') }
    })
    span.remove() // span đo 100px làm trang tràn ngang nếu để lại
    return out
  }
</script>
</html>
