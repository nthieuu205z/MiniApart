services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miniapart
      POSTGRES_USER: miniapart
      # Local-only fallback; deployment must provide POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniapart-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniapart -d miniapart"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miniapart
      SPRING_DATASOURCE_USERNAME: miniapart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-miniapart-dev}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
