# MiniApart (PRJ1-CCM) - moi truong chay tai may.
# Vertical Slice 11 bo sung Nginx va TLS; o day chi can ba tang noi duoc voi nhau.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ccm-postgres
    environment:
      POSTGRES_DB: ccm
      POSTGRES_USER: ccm
      POSTGRES_PASSWORD: ccm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccm -d ccm"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Quy uoc so 6: KHONG co khoa `ports`. Cong 5432 chi nhin thay tu trong
    # mang noi bo cua Docker. Them `ports` vao day la mo co so du lieu ra Internet
    # khi trien khai len may chu that.

  backend:
    build: ./backend
    container_name: ccm-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ccm
      DB_USER: ccm
      DB_PASSWORD: ccm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Chi mo ra ngoai de goi thang API luc phat trien. Slice 11 bo dong nay,
    # moi thu di qua Nginx.
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: ccm-frontend
    environment:
      # Trong mang Docker, backend co ten la `backend`, khong phai localhost.
      API_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  postgres-data:
